<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#050608" />
    <title>CodVex Mobile</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="shell">
      <header class="appbar">
        <button id="menuButton" class="icon-button" type="button" aria-label="Open menu" aria-expanded="false">
          <span aria-hidden="true">☰</span>
        </button>
        <div class="appbar-main">
          <p class="eyebrow">CodVex Mobile</p>
          <p id="threadMeta" class="subtle appbar-meta">Preparing local session...</p>
        </div>
        <span id="bridgeStatus" class="pill">Connecting</span>
      </header>

      <div id="menuOverlay" class="menu-overlay" hidden></div>
      <aside id="menuPanel" class="menu-panel" hidden>
        <div class="menu-head">
          <h2>Chat controls</h2>
          <button id="menuCloseButton" class="icon-button" type="button" aria-label="Close menu">
            <span aria-hidden="true">✕</span>
          </button>
        </div>
        <div class="menu-body">
          <div class="session-row">
            <label class="session-label" for="threadSelect">Session</label>
            <select id="threadSelect" class="thread-select"></select>
          </div>
          <div class="menu-actions">
            <button id="toggleDetailsButton" class="ghost-button" type="button">Details: off</button>
            <button id="refreshThreadsButton" class="ghost-button" type="button">Refresh</button>
          </div>
        </div>
      </aside>

      <main class="chat-panel">
        <div id="emptyState" class="empty-state">
          <p class="eyebrow">Chat ready</p>
          <h2>Select a thread to continue chatting.</h2>
          <p>
            Open the menu to pick the local Codex conversation you want to follow
            from your phone.
          </p>
        </div>

        <div id="messages" class="messages" hidden></div>
      </main>

      <form id="composer" class="composer" autocomplete="off">
        <label class="composer-label" for="promptInput">Message</label>
        <textarea
          id="promptInput"
          name="prompt"
          rows="3"
          placeholder="Type your next message..."
        ></textarea>
        <div class="composer-actions">
          <span id="composerHint" class="subtle">Chat mode shows only user and assistant messages.</span>
          <button id="sendButton" class="send-button" type="submit">Send</button>
        </div>
      </form>
    </div>

    <dialog id="requestDialog" class="request-dialog">
      <form id="requestForm" class="request-form" method="dialog">
        <div class="request-head">
          <p id="requestEyebrow" class="eyebrow">Approval needed</p>
          <h2 id="requestTitle">Incoming request</h2>
          <p id="requestDescription" class="request-description"></p>
        </div>
        <div id="requestBody" class="request-body"></div>
        <div id="requestActions" class="request-actions"></div>
      </form>
    </dialog>

    <script type="module" src="/app.js"></script>
  </body>
</html>
